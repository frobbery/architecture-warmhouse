openapi: 3.0.3
info:
  title: web-app
  description: web-app endpoints
  version: 1.0.0

tags:
  - name: Auth
  - name: Device
  - name: Camera
  - name: Telemetry
  - name: Scrypt

paths:
  /sign-in:
    post:
      tags: [Auth]
      summary: Sign in with username/email and password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '409':
          description: Username or email already exists
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /video/{cameraId}:
    get:
      tags: [Camera]
      summary: Stream real-time video from a camera
      description: Returns video stream for the given camera as an
        MJPEG multipart stream. Connection stays open and frames are
        pushed as they become available.
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Live video stream
          content:
            multipart/x-mixed-replace; boundary=frame:
              schema:
                type: string
                format: binary
        '503':
          description: Camera doesn't respond
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /devices/{userId}:
    get:
      tags: [Device]
      summary: Get available devices for users
      parameters:
        - in: path
          name: userId
          schema:
            type: number
          required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
    post:
      tags: [Device]
      summary: Registers device for user
      parameters:
        - in: path
          name: userId
          schema:
            type: number
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceDto'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '405':
          description: Device with this id already exists
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '503':
          description: Device doesn't respond
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /devices/{deviceId}:
    delete:
      tags: [Device]
      summary: Deletes existing device
      parameters:
        - in: path
          name: deviceId
          schema:
            type: number
          required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /actions/{deviceType}/available:
    get:
      tags: [Scrypt]
      summary: Get available actions for device
      parameters:
        - in: path
          name: deviceType
          schema:
            type: string
          required: true
        - in: query
          name: filter
          description: if actions should be filtered by current device state
          schema:
            type: boolean
          required: false
        - in: query
          name: deviceId
          schema:
            type: number
          required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionsResponse'
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /actions:
    post:
      tags: [Scrypt]
      summary: Perform action for device
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformActionRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  performed:
                    type: boolean
                    description: If action was called or not
  /scrypts:
    post:
      tags: [Scrypt]
      summary: Creates new scrypt for user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScryptRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  scryptId:
                    type: string
                    format: UUID
                    description: Id of created scrypt
    get:
      tags: [Scrypt]
      summary: Get scrypts of user
      parameters:
        - in: query
          name: userId
          schema:
            type: number
          required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScryptResponse'
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /scrypts/{scryptId}:
    post:
      tags: [Scrypt]
      parameters:
        - in: path
          name: scryptId
          schema:
            type: string
            format: UUID
          required: true
      summary: Adds actions to existing scrypt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddScryptActionRequest'
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
    delete:
      tags: [Scrypt]
      summary: Deletes existing scrypt
      parameters:
        - in: path
          name: scryptId
          schema:
            type: string
            format: UUID
          required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message

  /scrypts/{scryptId}/execute:
    get:
      tags: [Scrypt]
      summary: Executes scrypt single time
      parameters:
        - in: path
          name: scryptId
          schema:
            type: string
            format: UUID
          required: true
      responses:
        '200':
          description: All actions in scrypt were executed successfully
        '422':
          description: Some actions of script failed
          content:
            application/text:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceActionDto'
                description: List of failed actions
    post:
      tags: [Scrypt]
      summary: Creates schedule for scrypt
      parameters:
        - in: path
          name: scryptId
          schema:
            type: string
            format: UUID
          required: true
        - in: query
          name: schedule
          schema:
            type: string
          required: true
          description: cron expression for schedule
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '405':
          description: Schedule for this scrypt already exists
          content:
            application/text:
              schema:
                type: string
                description: Error message
    delete:
      tags: [Scrypt]
      summary: Deletes existing scrypt schedule
      parameters:
        - in: path
          name: scryptId
          schema:
            type: string
            format: UUID
          required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /telemetry/{deviceId}:
    get:
      tags: [Telemetry]
      summary: Get telemetry history of device
      description: If period not specified returns telemetry for last three days
      parameters:
        - in: path
          name: deviceId
          schema:
            type: number
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: dd-MM-yyyy
          required: false
        - in: query
          name: to
          schema:
            type: string
            format: dd-MM-yyyy
          required: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /telemetry/{deviceId}/real-time:
    post:
      tags: [Telemetry]
      summary: Gets real time telemetry result
      parameters:
        - in: path
          name: deviceId
          schema:
            type: number
          required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryDto'
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '503':
          description: Device doesn't respond
          content:
            application/text:
              schema:
                type: string
                description: Error message
  /telemetry/{deviceId}/schedule:
    post:
      tags: [Telemetry]
      summary: Add schedule for telemetry measurings on device
      parameters:
        - in: path
          name: deviceId
          schema:
            type: number
          required: true
        - in: path
          name: cronExpression
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
        '405':
          description: Schedule for this device already exists
          content:
            application/text:
              schema:
                type: string
                description: Error message
    delete:
      tags: [Telemetry]
      summary: Deletes schedule for telemetry measuring on device
      parameters:
        - in: path
          name: deviceId
          schema:
            type: number
          required: true
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request
          content:
            application/text:
              schema:
                type: string
                description: Error message
components:
  schemas:
    SignInRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    UserResponse:
      type: object
      properties:
        userId:
          type: number
        username:
          type: string
        email:
          type: string

    DevicesResponse:
      type: array
      items:
        $ref: '#/components/schemas/DeviceDto'

    DeviceDto:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'

    DeviceType:
      type: string
      enum:
        - HEATING
        - LIGHT
        - DOOR
        - CAMERA

    Action:
      type: string
      enum:
        - LIGHTS_ON
        - LIGHTS_OFF
        - LOCK_DOORS
        - UNLOCK_DOORS
        - HEATING_ON
        - HEATING_OF
        -
    ActionsResponse:
      type: array
      items:
        $ref: '#/components/schemas/Action'

    PerformActionRequest:
      type: object
      properties:
        deviceId:
          type: number
        action:
          $ref: '#/components/schemas/Action'

    CreateScryptRequest:
      type: object
      properties:
        name:
          type: string
        userId:
          type: number

    AddScryptActionRequest:
      type: array
      items:
        $ref: '#/components/schemas/DeviceActionDto'

    ScryptResponse:
      type: array
      items:
        $ref: '#/components/schemas/ScryptDto'

    ScryptDto:
      type: object
      properties:
        scryptId:
          type: string
          format: UUID
        name:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceActionDto'
        schedule:
          type: string
          nullable: true

    DeviceActionDto:
      type: object
      properties:
        deviceId:
          type: number
        deviceName:
          type: string
        action:
          $ref: '#/components/schemas/Action'

    TelemetryResponse:
      type: array
      items:
        $ref: '#/components/schemas/TelemetryDto'

    TelemetryDto:
      type: object
      properties:
        value:
          type: number
        unit:
          type: string
        measuredAt:
          type: string
          format: dd-MM-yyyy
